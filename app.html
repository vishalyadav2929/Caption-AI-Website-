<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ViralCaptionZone Editor — Free Video Captions</title>
  <meta name="description" content="Add viral animated captions to your videos for free. Hindi, Hinglish, English and 30+ languages. Live captions and upload.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="fonts" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="nav">
    <div class="wrap" style="max-width:none">
      <a class="logo" href="index.html"><span class="logo-mark">VC</span>ViralCaption<b>Zone</b></a>
      <div class="row" style="flex:0 0 auto;gap:8px">
        <button class="btn btn-sm" id="srtBtn" disabled>SRT</button>
        <button class="btn btn-primary btn-sm" id="exportBtn" disabled>Export video</button>
      </div>
    </div>
  </nav>

  <main class="app">
    <!-- Templates -->
    <aside class="panel">
      <div class="panel-h">Templates</div>
      <div class="panel-b">
        <div class="tabs" id="langTabs" aria-label="Preview language"></div>
        <div class="tabs" id="tabs"></div>
        <div class="grid" id="grid"></div>
      </div>
    </aside>

    <!-- Stage -->
    <section class="stage">
      <div class="mode-switch" role="tablist">
        <button id="modeFile" class="on">Upload video</button>
        <button id="modeLive">Live captions</button>
      </div>
      <div class="canvas-box" id="box">
        <canvas id="stage" width="1080" height="1920"></canvas>
        <label class="drop" id="drop">
          <input type="file" id="fileIn" accept="video/*,audio/*" hidden>
          <div>
            <div style="font-size:38px">⬆️</div>
            <strong>Drop a video here</strong>
            or click to choose · MP4, MOV, WEBM
          </div>
        </label>
      </div>
      <div class="transport" id="fileControls">
        <button class="btn btn-sm" id="playBtn" disabled>▶ Play</button>
        <input type="range" class="seek" id="seek" min="0" max="1000" value="0" disabled>
        <span class="time" id="time">0:00 / 0:00</span>
        <label class="btn btn-sm" for="fileIn">Replace</label>
      </div>
      <div class="transport" id="liveControls" hidden>
        <button class="btn btn-sm" id="camBtn">Start camera</button>
        <button class="btn btn-sm btn-primary" id="recBtn" disabled>● Record</button>
        <span class="time" id="liveTime"></span>
      </div>
    </section>

    <!-- Captions & style -->
    <aside class="panel">
      <div class="panel-h">Captions</div>
      <div class="panel-b">
        <div class="status" id="status"></div>

        <div class="field">
          <label for="lang">Language</label>
          <select id="lang"></select>
        </div>
        <div id="fileOnly">
          <div class="field">
            <label for="model">AI accuracy</label>
            <select id="model">
              <option value="onnx-community/whisper-tiny_timestamped">Fast · ~40 MB download</option>
              <option value="onnx-community/whisper-base_timestamped" selected>Balanced · ~80 MB</option>
              <option value="onnx-community/whisper-small_timestamped">Best for Hindi · ~250 MB</option>
            </select>
            <p class="hint">The model downloads once and stays cached in your browser.</p>
          </div>
          <label class="check field"><input type="checkbox" id="translate"> Translate captions to English</label>
          <button class="btn btn-primary" id="genBtn" style="width:100%" disabled>✨ Generate captions</button>
        </div>
        <label class="check field" style="margin-top:12px"><input type="checkbox" id="hinglish"> Show Hindi as Hinglish (Roman)</label>

        <div class="divider"></div>
        <div class="field">
          <label>Size <span id="sizeVal"></span></label>
          <input type="range" id="size" min="50" max="180" value="100">
        </div>
        <div class="field">
          <label>Position</label>
          <input type="range" id="pos" min="10" max="92" value="72">
        </div>
        <div class="field">
          <label>Words per caption: <span id="wordsVal"></span></label>
          <input type="range" id="words" min="1" max="8" value="3">
        </div>
        <div class="row field">
          <div class="color"><input type="color" id="color" value="#ffffff"> Text</div>
          <div class="color"><input type="color" id="hiColor" value="#ffe600"> Highlight</div>
        </div>
        <label class="check field"><input type="checkbox" id="upper"> UPPERCASE</label>

        <div class="divider"></div>
        <div class="panel-h" style="padding:0 0 10px;border:0">
          <span>Transcript</span>
          <label class="btn btn-sm" for="srtIn">Import SRT</label>
          <input type="file" id="srtIn" accept=".srt,.vtt,text/plain" hidden>
        </div>
        <div class="lines" id="lines"><p class="hint">Captions appear here. Edit any line to fix a word.</p></div>
      </div>
    </aside>
  </main>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
